# ai-ppt ??
ppt:
  api-key: ${PPT_API_KEY}

# Dedicated fast model for evaluation question generation.
# Override QUIZ_LLM_MODEL_NAME with a cheaper/faster JSON-capable model when available.
quiz:
  llm:
    api-key: ${QUIZ_LLM_API_KEY:${MIMO_API_KEY}}
    base-url: "${QUIZ_LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}"
    model-name: ${QUIZ_LLM_MODEL_NAME:mimo-v2.5-pro}

# Skill 体系开关：false=走老逻辑（prompts/*.txt），true=走 Skill 体系（skills/questions/*/SKILL.md）
smartorder:
  # 数字人展示开关：默认关闭，可通过环境变量开启。
  avatar:
    enabled: ${SMARTORDER_AVATAR_ENABLED:false}
  question:
    skill-enabled: false

practice:
  reminder:
    stage1-delay: 60        # 第一次提醒延迟（分钟），正式改为 1440（1天）
    stage2-delay: 1440        # 第二次提醒延迟（分钟，从开始算），正式改为 4320（3天）
